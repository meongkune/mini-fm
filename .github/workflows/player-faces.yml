# 선수 사진 통일 (수동 실행): 위키백과 사진 → 얼굴 기준으로 같은 틀(머리~가슴) 자르기 + 배경 제거 → data/faces → 커밋 → Pages 재배포
name: Player faces

on:
  workflow_dispatch:
    inputs:
      teams:
        description: '구단 ID (쉼표, 비우면 전체) 예: BRE,BMG'
        default: ''
      leagues:
        description: '리그 ID (쉼표, 비우면 전체)'
        default: ''
      limit:
        description: '이번에 만들 최대 인원'
        default: '3000'

permissions:
  contents: write
  actions: write

jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치
        # rembg가 다른 opencv를 끌어와 충돌하므로, 설치 뒤 opencv를 하나만 다시 깐다
        run: |
          pip install --quiet "rembg[cpu]" pillow numpy
          pip uninstall -y -q opencv-python opencv-python-headless opencv-contrib-python || true
          pip install --quiet --force-reinstall --no-deps opencv-python-headless==4.10.0.84
          pip list 2>/dev/null | grep -i -E "opencv|numpy|rembg"
          python -c "import cv2; print('opencv', cv2.__version__, cv2.__file__); cv2.CascadeClassifier"
      - name: 사진 통일
        shell: bash
        run: set -o pipefail; python tools/player_faces.py --teams "${{ inputs.teams }}" --leagues "${{ inputs.leagues }}" --limit ${{ inputs.limit }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 데이터 검사 (이상하면 커밋하지 않음)
        shell: bash
        run: set -o pipefail; node tools/check_data.mjs --base HEAD | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 변경 사항 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/faces
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 선수 통일 사진 (얼굴 기준 자르기·배경 제거)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub Pages 재배포
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
