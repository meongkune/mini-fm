# 선수 사진 통일 (수동 실행): 위키백과 사진 → 얼굴 기준으로 같은 틀(머리~가슴) 자르기 + 배경 제거 → data/faces → 커밋 → Pages 재배포
name: Player faces

on:
  workflow_dispatch:
    inputs:
      teams:
        description: '구단 ID (쉼표, 비우면 전체) 예: BRE,BMG'
        default: ''
      leagues:
        description: '리그 ID (쉼표, 비우면 전체)'
        default: ''
      limit:
        description: '이번에 만들 최대 인원'
        default: '3000'

permissions:
  contents: write
  actions: write

jobs:
  faces:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 라이브러리 설치
        run: pip install --quiet opencv-python-headless pillow numpy "rembg[cpu]"
      - name: 사진 통일
        run: python tools/player_faces.py --teams "${{ inputs.teams }}" --leagues "${{ inputs.leagues }}" --limit ${{ inputs.limit }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 변경 사항 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/faces
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 선수 통일 사진 (얼굴 기준 자르기·배경 제거)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub Pages 재배포
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
