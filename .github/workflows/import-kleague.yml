# K리그1·2 현재 명단 가져오기 (API-Football 무료 플랜, 요청 약 27회) → 커밋 → GitHub Pages 재배포
# Actions 탭에서 수동 실행. 시즌 중간에 이적이 많으면 다시 실행하면 된다.
name: Import K League squads

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: K리그 명단 가져오기
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: node tools/import_kleague.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 변경 사항 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/k-league frontend/public/data/index.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: K리그 현재 명단 (API-Football)"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: GitHub Pages 재배포
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
